name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_state.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Resolve repository metadata
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository_name}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/"
          else
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/"
          fi
          echo "SITE_URL=${site_url}" >> "${GITHUB_ENV}"
          echo "REPO_URL=https://github.com/${GITHUB_REPOSITORY}" >> "${GITHUB_ENV}"
          echo "REPO_NAME=${GITHUB_REPOSITORY}" >> "${GITHUB_ENV}"

      - name: Detect GitHub Pages
        id: pages_state
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --location --output /tmp/pages.json --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "${status}" == "200" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${status}" == "404" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::GitHub Pages is not enabled for this repository yet. Open Settings > Pages, choose GitHub Actions as the source, then rerun this workflow."
          else
            cat /tmp/pages.json
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir site

      - name: Upload GitHub Pages artifact
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
